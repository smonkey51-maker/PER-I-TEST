plugins {
    id 'com.android.application'
}

android {
    namespace 'app.atelier.wardrobe'
    compileSdk 34

    defaultConfig {
        applicationId 'app.atelier.wardrobe'
        minSdk 23
        targetSdk 34
        // Ogni build su GitHub ha un numero più alto, così l'APK nuovo si installa sopra il vecchio
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    // Chiave fissa e non segreta: l'APK è solo per uso personale (installazione diretta, fuori dagli store).
    // Serve ad avere sempre la stessa firma, necessaria per aprire l'app a schermo intero (assetlinks.json).
    signingConfigs {
        release {
            storeFile file('../atelier-personal.keystore')
            storePassword 'atelier-personal'
            keyAlias 'atelier'
            keyPassword 'atelier-personal'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
