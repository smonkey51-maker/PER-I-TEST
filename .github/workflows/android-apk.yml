name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [claude/apple-music-design-s5cqw0]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Costruisci l'APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon

      - name: Prepara il file
        run: cp android-app/app/build/outputs/apk/release/app-release.apk ATELIER.apk

      - name: Pubblica l'APK nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ATELIER per Android (ultima versione)
          body: |
            APK per l'installazione diretta su Android (fuori dagli store). L'app apre il sito ATELIER a schermo intero, quindi si aggiorna da sola a ogni modifica del sito: questo file va riscaricato solo se cambia il progetto Android.
          files: ATELIER.apk
          make_latest: true
